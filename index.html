<!DOCTYPE html>

<head>

<style>
:root{--bg:#f7f4f0;--card:#fff;--tx:#201a17;--mu:#80746d;--line:#ece5de;--ac:#c8281e;--ac2:#9f1d15;--soft:#fbebe9;--sh:0 6px 22px rgba(60,30,20,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141011;--card:#1f1819;--tx:#f4ede8;--mu:#a99d96;--line:#2f2627;--ac:#e0473b;--ac2:#b8322a;--soft:#2e1916;--sh:0 6px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#141011;--card:#1f1819;--tx:#f4ede8;--mu:#a99d96;--line:#2f2627;--ac:#e0473b;--ac2:#b8322a;--soft:#2e1916;--sh:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#invimg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);background:#fff;touch-action:pan-x pan-y;-webkit-touch-callout:default}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo",Tahoma,sans-serif;max-width:560px;margin-inline:auto;min-height:100vh;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 10% 8%,var(--soft),transparent 40%),radial-gradient(circle at 92% 70%,var(--soft),transparent 45%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-3%,3%) scale(1.12)}}
@keyframes inF{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes grow{from{width:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(200,40,30,.35)}100%{box-shadow:0 0 0 16px rgba(200,40,30,0)}}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;width:1em;overflow:hidden;white-space:nowrap;direction:ltr;letter-spacing:normal;text-transform:none;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";vertical-align:middle}
.in-f>*:not(.bar){animation:inF .45s cubic-bezier(.2,.8,.2,1) both}
.in-b>*:not(.bar){animation:inB .45s cubic-bezier(.2,.8,.2,1) both}
.in-f>.grid,.in-b>.grid,.in-f>.list,.in-b>.list{animation:none}
.in-f .sec,.in-f .item{animation:inF .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.in-b .sec,.in-b .item{animation:inB .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:21}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:none;background:var(--soft)}
.brand b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.brand small{color:var(--mu);font-size:12px}
.top h2{margin:0;font-size:20px;font-weight:800;flex:1}
.ib{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib i{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:#fff;font:800 11px/20px "Cairo";text-align:center;font-style:normal;padding:0 5px;animation:pop .35s both}
.hero{margin:6px 16px 14px;padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(160,30,20,.3);overflow:hidden;position:relative}
.hero h1{margin:0 0 4px;font-size:22px;font-weight:800}
.hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.6}
.hero .ms{font-size:64px;opacity:.9;animation:float 4s ease-in-out infinite;flex:none}
@keyframes float{50%{transform:translateX(-8px) translateY(-4px)}}
.chipsrow{display:flex;gap:8px;padding:0 16px 6px;overflow-x:auto;scrollbar-width:none}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.pill .ms{font-size:18px;color:var(--ac)}
.sh{margin:14px 16px 4px;font-size:17px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px}
.sec{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,border-color .2s}
.sec:active{transform:scale(.96)}
.sec:hover{border-color:var(--ac)}
.sec .ico{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--ac);display:grid;place-items:center;margin-bottom:6px;transition:transform .3s}
.sec:hover .ico{transform:rotate(-8deg) scale(1.08)}
.sec b{font-size:16px;font-weight:800}
.sec small{color:var(--mu);font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s}
.chip .ms{font-size:19px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.04)}
.note{display:flex;gap:10px;align-items:flex-start;margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);font-size:13.5px;line-height:1.7}
.note .ms{color:var(--ac);font-size:22px;flex:none}
.list{padding:0 16px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--sh)}
.pic{width:88px;height:88px;border-radius:14px;overflow:hidden;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--ac)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .ms{font-size:36px}
.inf{flex:1;min-width:0}
.inf b{display:block;font-size:15.5px;font-weight:700;line-height:1.4}
.price{color:var(--ac);font-weight:800;margin-top:2px}
.sz{display:inline-flex;gap:4px;margin-top:6px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.sz button{border:0;background:none;color:var(--mu);font:inherit;font-weight:800;font-size:13px;padding:2px 14px;border-radius:8px;cursor:pointer;transition:all .2s}
.sz button.on{background:var(--ac);color:#fff}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:34px;height:34px;border-radius:11px;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.qty button.m{background:var(--bg);color:var(--tx);border:1px solid var(--line)}
.qty button:active{transform:scale(.82)}
.qty span{min-width:26px;text-align:center;font-weight:800;font-size:17px}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:auto;z-index:30;display:flex;gap:10px;align-items:stretch}
.bar .cta{flex:1;width:auto}
.bb{flex:none;width:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.bb:active{transform:scale(.9)}
.bar.pop{animation:up .5s cubic-bezier(.2,1.2,.3,1)}
.cta{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 28px rgba(160,30,20,.4);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta .n{background:rgba(255,255,255,.22);border-radius:10px;padding:1px 10px}
.cta.wa{background:linear-gradient(135deg,#25b861,#14803f);box-shadow:0 10px 24px rgba(20,128,63,.35)}
.cta.ms2{background:linear-gradient(135deg,#2f86f0,#4b46d6);box-shadow:0 10px 24px rgba(60,80,210,.35)}
.cta.plain{justify-content:center}
.steps{display:flex;align-items:center;gap:0;padding:4px 20px 14px}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);width:60px}
.stp i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);font:800 13px "Cairo";font-style:normal}
.stp.on{color:var(--tx);font-weight:700}
.stp.on i{background:var(--ac);border-color:var(--ac);color:#fff}
.ln{flex:1;height:3px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
.ln s{display:block;height:100%;width:100%;background:var(--ac);animation:grow .6s both}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 16px 14px;padding:16px;box-shadow:var(--sh)}
.box h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:16.5px;font-weight:800}
.box h3 .ms{color:var(--ac)}
label{display:flex;align-items:center;gap:6px;font-weight:700;margin:12px 0 6px;font-size:14px}
label .ms{font-size:19px;color:var(--mu)}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
input[type=file]{width:100%;font:inherit;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:15px}
.tot{font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;color:var(--ac)}
.pay{display:flex;gap:10px}
.pay label{flex:1;margin:0;flex-direction:column;gap:4px;text-align:center;border:2px solid var(--line);border-radius:16px;padding:14px 6px;cursor:pointer;transition:all .2s;font-size:13.5px}
.pay label .ms{font-size:28px;color:var(--mu);transition:color .2s}
.pay input{display:none}
.pay label:has(input:checked){border-color:var(--ac);background:var(--soft);animation:ring .6s}
.pay label:has(input:checked) .ms{color:var(--ac)}
.err{color:var(--ac);font-size:13px;font-weight:700;margin-top:6px;display:none}
.hide{display:none}
.ok{text-align:center;padding:24px 16px 8px}
.ok .ms{font-size:84px;color:#1f9d55;animation:pop .6s both .2s}
.ok h2{margin:6px 0;font-size:24px;font-weight:800}
.ok p{color:var(--mu);margin:0}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}
.empty .ms{font-size:64px;color:var(--ac);opacity:.6}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

].map(([n,ic,its,note])=>({n,ic,note,items:its.map(([nm,a,b])=>({n:nm,sizes:b===undefined?{"":a}:b===null?{M:a}:{M:a,L:b}}))}));
const cart={},sel={};
const hist=[];let deferred=null;
let view="home",sec=0,pay="cash",shot=null,form={name:"",addr:"",phone:"",notes:""},dir="f",anim=true,prevCnt=0;
const RK={home:0,sec:1,cart:2,checkout:3,done:4};
const k3=(s,i,z)=>s+"-"+i+"-"+z;
const cur=(s,i)=>sel[s+"-"+i]??Object.keys(M[s].items[i].sizes)[0];
const lines=()=>{const r=[];M.forEach((m,s)=>m.items.forEach((it,i)=>Object.keys(it.sizes).forEach(z=>{const k=k3(s,i,z),q=cart[k]||0;if(q)r.push({k,ic:m.ic,n:it.n+(z?" ("+z+")":""),p:it.sizes[z],q})})));return r};
const sub=()=>lines().reduce((a,l)=>a+l.p*l.q,0);
const cnt=()=>lines().reduce((a,l)=>a+l.q,0);
const $=h=>{const a=document.getElementById("app");a.innerHTML='<div class="view'+(anim?' in-'+dir:'')+'">'+h+'</div>';anim=false};
function chgK(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);render()}
function setSz(s,i,z){sel[s+"-"+i]=z;render()}
function go(v,s){const ns=s===undefined?sec:s;dir=(RK[v]>RK[view]||(v==="sec"&&view==="sec"&&ns>sec))?"f":"b";if(!(v==="sec"&&view==="sec"))hist.push([view,sec]);view=v;sec=ns;anim=true;window.scrollTo(0,0);render()}
function back(){if(!hist.length)return;if(view==="checkout")saveForm();const p=hist.pop();dir="b";view=p[0];sec=p[1];anim=true;window.scrollTo(0,0);render()}
function doInstall(){if(!deferred)return;deferred.prompt();deferred=null;render()}
const BB=`<button class="bb" aria-label="رجوع" onclick="back()">${I("arrow_forward")}</button>`;
function saveForm(){["name","addr","phone","notes"].forEach(f=>{const e=document.getElementById("f_"+f);if(e)form[f]=e.value})}
const cartBtn=()=>`<button class="ib" aria-label="السلة" onclick="go('cart')">${I("shopping_bag")}${cnt()?`<i>${cnt()}</i>`:""}</button>`;
function bar(){const c=cnt(),pop=c&&!prevCnt;prevCnt=c;const b=view==="sec"?BB:"";if(!c&&!b)return "";return `<div class="bar${pop?" pop":""}">${b}${c?`<button class="cta" onclick="go('cart')"><span>${I("shopping_bag")} عرض السلة <span class="n">${c}</span></span><span>${sub()} ج</span></button>`:""}</div>`}
const steps=n=>`<div class="steps">${["السلة","البيانات","الفاتورة"].map((t,i)=>`${i?`<div class="ln">${i<=n?"<s></s>":""}</div>`:""}<div class="stp${i<=n?" on":""}"><i>${i+1}</i>${t}</div>`).join("")}</div>`;
const photo=(it,ic)=>PHOTOS[it.n]?`<img src="${PHOTOS[it.n]}" alt="${it.n}">`:I(ic);
function render(){
if(view==="home"){
$(`<header class="top"><div class="brand"><img class="logo" src="${LOGO}" alt=""><div><b>${CFG.name}</b><small>منية النصر، الجنينة</small></div></div>${deferred?`<button class="ib" aria-label="تثبيت التطبيق" onclick="doInstall()">${I("download")}</button>`:""}${cartBtn()}</header>
<section class="hero"><div><h1>جعان؟ اطلب دلوقتي</h1><p>اختار من الأقسام وابعت طلبك على واتساب أو ماسنجر</p></div>${I("delivery_dining")}</section>
<div class="chipsrow"><span class="pill">${I("delivery_dining")}توصيل لحد باب البيت</span><span class="pill">${I("payments")}كاش أو فودافون كاش</span></div>
<h2 class="sh">الأقسام</h2>
<div class="grid">${M.map((m,s)=>`<button class="sec" style="--i:${s}" onclick="go('sec',${s})"><span class="ico">${I(m.ic)}</span><b>${m.n}</b><small>${m.items.length} صنف</small></button>`).join("")}</div>${bar()}`);
}else if(view==="sec"){
const m=M[sec];
$(`<header class="top"><h2>${m.n}</h2>${cartBtn()}</header>
<nav class="chips">${M.map((x,s)=>`<button class="chip${s===sec?" on":""}" onclick="go('sec',${s})">${I(x.ic)}${x.n}</button>`).join("")}</nav>
${m.note?`<div class="note">${I("info")}<span>${m.note}</span></div>`:""}
<div class="list">${m.items.map((it,i)=>{const z=cur(sec,i),ks=Object.keys(it.sizes);return `<article class="item" style="--i:${i}"><div class="pic">${photo(it,m.ic)}</div><div class="inf"><b>${it.n}${ks.length===1&&z?" ("+z+")":""}</b><div class="price">${it.sizes[z]} ج</div>${ks.length>1?`<div class="sz">${ks.map(k=>`<button class="${k===z?"on":""}" onclick="setSz(${sec},${i},'${k}')">${k}</button>`).join("")}</div>`:""}<div class="qty"><button aria-label="زيادة" onclick="chgK('${k3(sec,i,z)}',1)">${I("add")}</button><span>${cart[k3(sec,i,z)]||0}</span><button class="m" aria-label="نقصان" onclick="chgK('${k3(sec,i,z)}',-1)">${I("remove")}</button></div></div></article>`}).join("")}</div>${bar()}`);
requestAnimationFrame(()=>{const c=document.querySelector(".chip.on");if(c)c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})});
}else if(view==="cart"){
const L=lines();
$(`<header class="top"><h2>سلة الطلب</h2></header>${steps(0)}
${L.length?`<div class="list">${L.map((l,i)=>`<article class="item" style="--i:${i}"><div class="pic" style="width:60px;height:60px">${I(l.ic)}</div><div class="inf"><b>${l.n}</b><div class="price">${l.p*l.q} ج</div><div class="qty" style="margin-top:4px"><button onclick="chgK('${l.k}',1)">${I("add")}</button><span>${l.q}</span><button class="m" onclick="chgK('${l.k}',-1)">${I("remove")}</button></div></div></article>`).join("")}</div>
<div class="box"><div class="row tot" style="border:0;margin:0;padding:0"><span>إجمالي الأصناف</span><span>${sub()} ج</span></div></div>
<div class="bar">${BB}<button class="cta plain" onclick="go('checkout')">متابعة الطلب</button></div>`:`<div class="empty">${I("shopping_bag")}<p>السلة فاضية، ابدأ اختار من المنيو</p></div><div class="bar">${BB}</div>`}`);
}else if(view==="checkout"){
$(`<header class="top"><h2>بيانات الطلب</h2></header>${steps(1)}
<div class="box"><h3>${I("person")}بيانات التوصيل</h3>
<label>${I("person")}الاسم</label><input type="text" id="f_name" placeholder="اكتب اسمك" value="${esc(form.name)}">
<label>${I("location_on")}العنوان</label><input type="text" id="f_addr" placeholder="المنطقة، الشارع، رقم العمارة، الدور" value="${esc(form.addr)}">
<label>${I("call")}رقم الموبايل</label><input type="tel" id="f_phone" placeholder="01xxxxxxxxx" value="${esc(form.phone)}">
<label>${I("edit_note")}ملاحظات على الأوردر</label><textarea id="f_notes" rows="3" placeholder="مثال: من غير بصل">${esc(form.notes)}</textarea></div>
<div class="box"><h3>${I("payments")}طريقة الدفع</h3><div class="pay">
<label><input type="radio" name="p" ${pay==="cash"?"checked":""} onchange="setPay('cash')">${I("payments")}الدفع عند الاستلام</label>
<label><input type="radio" name="p" ${pay==="vf"?"checked":""} onchange="setPay('vf')">${I("smartphone")}فودافون كاش</label></div>
<div id="vf" class="${pay==="vf"?"":"hide"}"><div style="text-align:center;margin:16px 0 4px"><div style="font-size:15px;color:var(--mu)">حوّل المبلغ على فودافون كاش</div><div style="font-size:36px;font-weight:800;letter-spacing:1px;color:var(--ac);direction:ltr;margin:6px 0">${CFG.vf}</div><div style="font-size:16px;font-weight:600">ابعت سكرين التحويل على نفس الرقم</div></div></div>
<div class="note" style="margin:12px 0 0">${I("delivery_dining")}<span>مصاريف التوصيل بتتحدد حسب منطقتك وبتتدفع للمندوب عند الاستلام.</span></div></div>
<div class="box"><h3>${I("receipt_long")}ملخص الحساب</h3><div class="row"><span>الأصناف</span><span>${sub()} ج</span></div><div class="row"><span>التوصيل</span><span>بيتحدد عند الاستلام</span></div>
<div class="row tot"><span>${pay==="cash"?"المطلوب عند الاستلام":"عند الاستلام"}</span><span>${pay==="cash"?sub()+" ج + التوصيل":"مصاريف التوصيل فقط"}</span></div></div>
<div class="err" id="e_f" style="margin:0 16px 8px">من فضلك اكتب الاسم والعنوان ورقم الموبايل</div>
<div class="bar">${BB}<button class="cta plain" onclick="confirmOrder()">تأكيد الطلب</button></div>`);
}else{
$(`<header class="top"><div class="brand"><img class="logo" src="${LOGO}" alt=""><div><b>${CFG.name}</b></div></div></header>${steps(2)}
<div class="ok">${I("check_circle")}<h2>تم تجهيز الفاتورة</h2><p>اضغط إرسال وهتتبعت كرسالة مرتبة</p></div>
<div class="box"><div id="msgprev" style="white-space:pre-wrap;line-height:1.9;font-size:15px"></div></div>
<div class="box"><div class="note" id="hint" style="margin:0 0 12px">${I("info")}<span>واتساب: بيفتح الشات والرسالة مكتوبة جاهزة، دوس إرسال. ماسنجر: بيفتح الشات والرسالة بتتنسخ، الصقها وابعت.</span></div><button class="cta wa" onclick="sendTxt('wa')"><span>${I("chat")} إرسال الفاتورة عبر واتساب</span></button><div style="height:10px"></div><button class="cta ms2" onclick="sendTxt('ms')"><span>${I("forum")} إرسال الفاتورة عبر ماسنجر</span></button>${pay==="vf"?`<div class="note" style="margin:12px 0 0">${I("info")}<span>بعد الإرسال، ابعت صورة سكرين فودافون كاش في نفس الشات.</span></div>`:""}</div>
<div class="bar">${BB}<button class="cta plain" onclick="back()">تعديل بيانات الطلب</button></div>`);
document.getElementById("msgprev").textContent=invText(false);
}}
function setPay(p){saveForm();if(p!==pay)shot=null;pay=p;render()}
function confirmOrder(){saveForm();let bad=false;
if(!form.name.trim()||!form.addr.trim()||!form.phone.trim()){document.getElementById("e_f").style.display="block";bad=true}
if(!bad)go("done")}
function invText(b){
const B=b?"*":"",due=pay==="cash"?sub()+" ج + مصاريف التوصيل":"مصاريف التوصيل فقط",D="━━━━━━━━━━━━";
const items=lines().map(l=>"• "+l.q+" × "+l.n+" = "+l.p*l.q+" ج").join("\n");
return "🧾 "+B+"فاتورة طلب جديد - "+CFG.name+B+"\n"+D+"\n👤 "+B+"الاسم:"+B+" "+form.name+"\n📍 "+B+"العنوان:"+B+" "+form.addr+"\n📞 "+B+"الموبايل:"+B+" "+form.phone+"\n📝 "+B+"ملاحظات:"+B+" "+(form.notes||"—")+"\n💳 "+B+"طريقة الدفع:"+B+" "+(pay==="cash"?"الدفع عند الاستلام":"فودافون كاش")+"\n"+D+"\n🍽️ "+B+"الأوردر:"+B+"\n"+items+"\n"+D+"\n💰 "+B+"إجمالي الأصناف:"+B+" "+sub()+" ج\n🛵 "+B+"التوصيل:"+B+" بيتدفع للمندوب عند الاستلام\n✅ "+B+"المطلوب عند الاستلام:"+B+" "+due+(pay==="vf"?"\n📸 سكرين التحويل هيتبعت بعد الرسالة":"")}
function sendTxt(app){
const hint=document.getElementById("hint");
if(app==="wa"){window.open("https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(invText(true)),"_blank");if(hint)hint.innerHTML=I("check_circle")+"<span>الرسالة اتكتبت في شات واتساب، دوس إرسال."+(pay==="vf"?" وبعدها ابعت صورة سكرين التحويل في نفس الشات.":"")+"</span>";return}
const t=invText(false);
try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}catch(e){fbCopy(t)}
if(hint)hint.innerHTML=I("check_circle")+"<span>الفاتورة اتنسخت. الصقها في شات ماسنجر وابعت."+(pay==="vf"?" وبعدها ابعت صورة سكرين التحويل.":"")+"</span>";
window.open("https://m.me/"+CFG.ms,"_blank")}
function fbCopy(t){try{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}catch(e){}}
["gesturestart","gesturechange","gestureend"].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key))e.preventDefault()});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;if(view==="home")render()});
try{history.pushState({g:1},"");window.addEventListener("popstate",()=>{if(hist.length){back();try{history.pushState({g:1},"")}catch(e){}}})}catch(e){}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
